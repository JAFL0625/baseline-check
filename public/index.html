<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feature Compatibility</title>
<style>
  body { font-family: system-ui, sans-serif; background: #f6f8fa; color: #333; padding: 2rem; }
  h1 { text-align: center; margin-bottom: 1rem; }
  form { max-width: 600px; margin: 0 auto 2rem; display: flex; gap: 0.5rem; }
  input[type="text"] { flex: 1; padding: 0.6rem; border: 1px solid #ccc; border-radius: 6px; }
  button { background: #0366d6; color: #fff; border: none; padding: 0.6rem 1.2rem; border-radius: 6px; cursor: pointer; font-weight: 600; }
  button:hover { background: #0253ad; }
  table { width: 100%; border-collapse: collapse; margin-top: 1rem; background: #fff; border-radius: 6px; overflow: hidden; }
  th, td { padding: 0.8rem; border-bottom: 1px solid #eee; text-align: left; }
  th { background: #f0f3f6; }
  .ok { color: green; font-weight: 600; }
  .error { color: crimson; font-weight: 600; }
  .msg { text-align: center; margin-top: 1rem; }
</style>
</head>
<body>
<h1>Feature Compatibility</h1>
<form id="checkForm">
  <input id="featuresInput" type="text" placeholder="Example: CSS Variables, Web Bluetooth API" />
  <button type="submit">Check</button>
</form>
<div id="results" class="msg">Enter features and click "Check".</div>

<script>
const form = document.getElementById('checkForm');
const input = document.getElementById('featuresInput');
const resultsDiv = document.getElementById('results');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const features = input.value.split(',').map(f => f.trim()).filter(Boolean);
  if (!features.length) return resultsDiv.innerHTML = '<span class="error">Enter at least one feature</span>';

  resultsDiv.textContent = 'Loading…';

  try {
    const response = await fetch('/api/compatibility', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ features })
    });

    const data = await response.json();
    if (!Array.isArray(data) || data.length === 0) {
      resultsDiv.innerHTML = '<span class="error">No results found for these features.</span>';
      return;
    }

    let html = '<table><tr><th>Feature</th><th>Compatible Browsers</th><th>Baseline</th></tr>';
    data.forEach(item => {
      html += `<tr>
        <td>${item.feature}</td>
        <td>${item.compatibleBrowsers.length ? item.compatibleBrowsers.join(', ') : '<span class="error">None</span>'}</td>
        <td class="${item.baselineOK ? 'ok' : 'error'}">${item.baselineOK ? '✔️' : '❌'}</td>
      </tr>`;
    });
    html += '</table>';
    resultsDiv.innerHTML = html;

  } catch (err) {
    resultsDiv.innerHTML = `<span class="error">Error: ${err.message}</span>`;
  }
});
</script>
</body>
</html>
